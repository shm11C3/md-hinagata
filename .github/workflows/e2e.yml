name: E2E

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vscode-extension:
    name: VS Code extension smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt,clippy
          targets: wasm32-unknown-unknown

      - name: Install Linux browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@aaa84a43aec4955a42c5ffc65d258961e39f276e # v1.19.1
        with:
          version: 1.19.1

      - name: Install wasm-bindgen CLI
        run: cargo binstall wasm-bindgen-cli --version 0.2.121 --no-confirm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run E2E smoke tests
        run: xvfb-run -a pnpm run test:e2e

      - name: Run packaged VSIX smoke tests
        run: xvfb-run -a pnpm run test:e2e:packaged
