name: Set up Node.js
description: Set up pnpm, Node.js, and optionally install workspace dependencies.

inputs:
  install-deps:
    description: Whether to run pnpm install.
    default: "true"
  node-version:
    description: Node.js version to install.
    default: "22.6.0"

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8

    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        # Node 22.6.0 introduced --experimental-strip-types, which this repo uses for TS scripts.
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      if: inputs.install-deps == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
